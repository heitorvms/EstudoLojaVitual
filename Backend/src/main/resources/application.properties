spring.application.name=Backend

# Carrega segredos locais (arquivo ignorado pelo Git — copie de application-local.properties.example)
spring.config.import=optional:classpath:application-local.properties

# --- Configuração do PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/loja
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# schema.sql roda DEPOIS do Hibernate criar as tabelas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Seed idempotente: permissões + usuário heitor@local.dev (senha 123)
app.seed.default-user.enabled=true

spring.datasource.testeWhileIdle=true
spring.datasource.validationQuery=SELECT 1

# --- E-mail (defina MAIL_USERNAME e MAIL_PASSWORD no ambiente / IDE) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Upload de arquivos (planilhas de import) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- WPPConnect ---
wppconnect.url=http://localhost:21465
wppconnect.sessao=hsa-serralheria
wppconnect.secretkey=hsa-chave-123
